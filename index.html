<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una Galaxia Para Ti ✨</title>

  <!-- CDNs: Three.js, OrbitControls y GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020208;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #webgl-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Header flotante */
    .header-ui {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .header-ui h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 30px rgba(180, 100, 255, 0.8);
    }

    .header-ui p {
      font-size: 0.9rem;
      color: #d1c4e9;
      margin-top: 5px;
      opacity: 0.85;
    }

    /* Modal estilo Glassmorphism */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 30px 25px;
      max-width: 400px;
      width: 85%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(150, 100, 255, 0.3);
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-card .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
      display: block;
    }

    .modal-card h2 {
      color: #fff;
      font-size: 1.5rem;
      margin-bottom: 12px;
    }

    .modal-card p {
      color: #e0e0ff;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .modal-card button {
      background: linear-gradient(135deg, #7b2cbf, #9d4edd);
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(157, 78, 221, 0.4);
      transition: all 0.2s ease;
    }

    .modal-card button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(157, 78, 221, 0.6);
    }
  </style>
</head>
<body>

  <div class="header-ui">
    <h1>GALAXIA ESPECIAL ✨</h1>
    <p>Toca los planetas o la foto para descubrir mensajes</p>
  </div>

  <div id="webgl-container"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <span class="icon" id="modal-icon">🪐</span>
      <h2 id="modal-title">Planeta</h2>
      <p id="modal-text">Frase bonita...</p>
      <button onclick="closeModal()">Cerrar ✨</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN Y RECURSOS
    // ==========================================
    
    // Cambia este enlace por la imagen de tu amiga o pon el nombre de su archivo (ej: 'amiga.jpg')
    const FOTO_AMIGA_URL = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80';

    const planetData = [
      {
        name: 'Mercurio',
        color: 0xaaaaaa,
        size: 0.6,
        distance: 8,
        speed: 0.015,
        icon: '🪙',
        phrase: 'Aunque Mercurio sea el planeta más cercano al Sol, nada brilla tanto en mi vida como tu bonita sonrisa.'
      },
      {
        name: 'Venus',
        color: 0xe3bb76,
        size: 0.9,
        distance: 12,
        speed: 0.012,
        icon: '✨',
        phrase: 'Venus es el planeta de la belleza, pero en todo el universo no existe nadie con tanta luz como tú.'
      },
      {
        name: 'Tierra',
        color: 0x2233ff,
        size: 1.0,
        distance: 16,
        speed: 0.010,
        icon: '🌍',
        phrase: 'Entre más de 8 mil millones de personas en la Tierra, tener tu amistad es el regalo más valioso.'
      },
      {
        name: 'Marte',
        color: 0xff4422,
        size: 0.8,
        distance: 20,
        speed: 0.008,
        icon: '🔥',
        phrase: 'Dicen que Marte es de fuego, pero es tu gran energía y fuerza la que enciende todo a tu alrededor.'
      },
      {
        name: 'Júpiter',
        color: 0xd0a880,
        size: 2.2,
        distance: 26,
        speed: 0.005,
        icon: '👑',
        phrase: 'Ni el planeta más gigante de la galaxia se compara con lo inmenso que es tu corazón.'
      },
      {
        name: 'Saturno',
        color: 0xe0c080,
        size: 1.7,
        distance: 33,
        speed: 0.003,
        hasRings: true,
        icon: '🪐',
        phrase: 'Tus abrazos, tu alegría y tu apoyo valen mucho más que todos los valiosos anillos de Saturno.'
      },
      {
        name: 'Urano',
        color: 0x66ccff,
        size: 1.3,
        distance: 40,
        speed: 0.002,
        icon: '💎',
        phrase: 'Universo único, auténtico y brillante... exactamente igual a la manera en que tú eres.'
      },
      {
        name: 'Neptuno',
        color: 0x3344ff,
        size: 1.2,
        distance: 46,
        speed: 0.001,
        icon: '🌊',
        phrase: 'Tan infinito y azul como las profundidades del espacio: así de grande es el cariño que te tengo.'
      }
    ];

    const fraseFotoAmiga = "Eres el centro brillante de este universo. Gracias por iluminar mi vida con tu existencia, tu presencia y tu amistad incondicional. ❤️✨";

    // ==========================================
    // 2. ESCENA 3D Y CÁMARA
    // ==========================================
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020208, 0.012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 25, 45);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 90;
    controls.minDistance = 10;

    // Luces
    const ambientLight = new THREE.AmbientLight(0x333355, 1.2);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 2, 100);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);

    // ==========================================
    // 3. FONDO DE ESTRELLAS Y GALAXIA
    // ==========================================
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 4000;
    const starPositions = new Float32Array(starsCount * 3);

    for (let i = 0; i < starsCount * 3; i += 3) {
      starPositions[i] = (Math.random() - 0.5) * 200;
      starPositions[i + 1] = (Math.random() - 0.5) * 200;
      starPositions[i + 2] = (Math.random() - 0.5) * 200;
    }

    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.35,
      transparent: true,
      opacity: 0.8
    });
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    // ==========================================
    // 4. CREACIÓN DEL MARCO 3D CON LA FOTO
    // ==========================================
    const photoGroup = new THREE.Group();
    scene.add(photoGroup);

    // Marco exterior brillante
    const frameGeo = new THREE.RingGeometry(2.8, 3.2, 32);
    const frameMat = new THREE.MeshBasicMaterial({ color: 0xff77aa, side: THREE.DoubleSide });
    const frameMesh = new THREE.Mesh(frameGeo, frameMat);
    photoGroup.add(frameMesh);

    // Textura de la Foto
    const textureLoader = new THREE.TextureLoader();
    textureLoader.load(FOTO_AMIGA_URL, (texture) => {
      const photoGeo = new THREE.CircleGeometry(2.7, 32);
      const photoMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
      const photoMesh = new THREE.Mesh(photoGeo, photoMat);
      photoMesh.userData = { isPhoto: true, name: 'Mi Persona Favorita', icon: '💖', phrase: fraseFotoAmiga };
      photoGroup.add(photoMesh);
    });

    // Luz propia para la foto
    const photoLight = new THREE.PointLight(0xff66cc, 1.5, 15);
    photoGroup.add(photoLight);

    // ==========================================
    // 5. CREACIÓN DE PLANETAS
    // ==========================================
    const planets = [];

    planetData.forEach((data) => {
      const pivot = new THREE.Group();
      scene.add(pivot);

      // Órbita dibujada
      const orbitGeo = new THREE.RingGeometry(data.distance - 0.05, data.distance + 0.05, 64);
      const orbitMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.08 });
      const orbitMesh = new THREE.Mesh(orbitGeo, orbitMat);
      orbitMesh.rotation.x = Math.PI / 2;
      scene.add(orbitMesh);

      // Esfera del planeta
      const planetGeo = new THREE.SphereGeometry(data.size, 32, 32);
      const planetMat = new THREE.MeshStandardMaterial({
        color: data.color,
        roughness: 0.6,
        metalness: 0.2
      });
      const planetMesh = new THREE.Mesh(planetGeo, planetMat);
      planetMesh.position.x = data.distance;

      // Anillos de Saturno si corresponde
      if (data.hasRings) {
        const ringGeo = new THREE.RingGeometry(data.size + 0.5, data.size + 1.5, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xc2a661, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2;
        planetMesh.add(ringMesh);
      }

      planetMesh.userData = {
        name: data.name,
        phrase: data.phrase,
        icon: data.icon,
        isPlanet: true
      };

      pivot.add(planetMesh);

      planets.push({
        pivot: pivot,
        mesh: planetMesh,
        speed: data.speed
      });
    });

    // ==========================================
    // 6. INTERACCIÓN (TOUCH / CLICK RAYCASTER)
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onPointerDown(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      // Lista de objetos clickeables
      const clickables = [];
      planets.forEach(p => clickables.push(p.mesh));
      photoGroup.traverse(child => {
        if (child.userData && child.userData.isPhoto) clickables.push(child);
      });

      const intersects = raycaster.intersectObjects(clickables);

      if (intersects.length > 0) {
        const clickedObj = intersects[0].object;
        const data = clickedObj.userData;

        // Efecto visual de pulso con GSAP
        gsap.to(clickedObj.scale, {
          x: 1.3,
          y: 1.3,
          z: 1.3,
          duration: 0.25,
          yoyo: true,
          repeat: 1
        });

        openModal(data.icon, data.name, data.phrase);
      }
    }

    window.addEventListener('pointerdown', onPointerDown);

    // Modal Handlers
    const modal = document.getElementById('modal');
    const modalIcon = document.getElementById('modal-icon');
    const modalTitle = document.getElementById('modal-title');
    const modalText = document.getElementById('modal-text');

    function openModal(icon, title, text) {
      modalIcon.textContent = icon;
      modalTitle.textContent = title;
      modalText.textContent = text;
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    // ==========================================
    // 7. BUCLE DE ANIMACIÓN
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);

      // Rotación de la galaxia/estrellas
      starField.rotation.y += 0.0002;

      // Movimiento orbital de los planetas
      planets.forEach(p => {
        p.pivot.rotation.y += p.speed;
        p.mesh.rotation.y += 0.01;
      });

      // Rotación suave de la foto central
      photoGroup.rotation.y += 0.005;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // Responsive window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
